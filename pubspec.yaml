name: burger_farm
description: "Burger Farm — Enterprise Flutter Commerce Platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  firebase_app_check: ^0.4.3
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.1.0
  geolocator: ^14.0.2
  go_router: ^17.2.3
  google_sign_in: ^6.2.2
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/brand/
    - assets/images/onboarding/
    - assets/images/preferences/
    - assets/videos/

  fonts:
    # ─── Recoleta: Primary UI Font (--fu in CSS) ───────────────────────────
    # Used for all body text, buttons, inputs, labels, and UI elements.
    - family: Recoleta
      fonts:
        - asset: assets/fonts/recoleta/Recoleta-Light.otf
          weight: 300
        - asset: assets/fonts/recoleta/Recoleta-Regular.otf
          weight: 400
        - asset: assets/fonts/recoleta/Recoleta-Medium.otf
          weight: 500
        - asset: assets/fonts/recoleta/Recoleta-SemiBold.otf
          weight: 600
        - asset: assets/fonts/recoleta/Recoleta-Bold.otf
          weight: 700
        - asset: assets/fonts/recoleta/Recoleta-Black.otf
          weight: 900

    # ─── Montreux: Display / Branding Font (--fd in CSS) ───────────────────
    # Used for splash logo, page headers, brand wordmark, and display titles.
    # NOTE: Only one weight file is available (Regular/400). CSS declarations
    # using font-weight 700/800/900 with 'Montreux Classic' will fall back
    # to the single available weight. This is a known font asset limitation.
    # Recommend acquiring the Bold weight from the font vendor for full fidelity.
    - family: MontreuxClassic
      fonts:
        - asset: assets/fonts/montreux/Montreux-Regular.otf
          weight: 400
        - asset: assets/fonts/montreux/Montreux-Regular.otf
          weight: 700
