<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Burger Farm - Preferences</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#E8560A', hover: '#C94208', light: '#FFF0E5' },
            brown: { DEFAULT: '#271200', muted: 'rgba(39, 18, 0, 0.42)', light: 'rgba(39, 18, 0, 0.06)' },
            cream: '#FBF7F2',
            line: '#EBE1D6',
            success: '#1A7A38',
            danger: '#C0001A',
          },
          fontFamily: {
            display: ['"Montreux Classic"', 'sans-serif'],
            sans: ['"Recoleta"', 'serif'],
          },
          boxShadow: {
            soft: '0 4px 24px rgba(39, 18, 0, 0.04), 0 1px 2px rgba(39, 18, 0, 0.02)',
            premium: '0 20px 40px -10px rgba(39,18,0,0.08), 0 1px 3px rgba(39,18,0,0.05)',
            glow: '0 8px 24px rgba(232, 86, 10, 0.25)',
            'brand-glow': '0 10px 30px -10px rgba(232,86,10,0.4), 0 4px 10px rgba(232,86,10,0.2)',
            float: '0 -12px 32px rgba(39, 18, 0, 0.04)',
            inset_soft: 'inset 0 2px 8px rgba(39, 18, 0, 0.04)',
          },
          transitionTimingFunction: {
            'spring': 'cubic-bezier(0.16, 1, 0.3, 1)',
          }
        }
      }
    }
  </script>
  
  <style>
    /* Premium Noise Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-semibold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Montreux Classic'; src: url('fonts/montreux-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Montreux Classic'; src: url('fonts/montreux-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    
    body { background-color: #F5EFE6; }
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    /* Hide default radio buttons */
    input[type="radio"] { display: none; }
    input[type="checkbox"] { display: none; }
  </style>
</head>

<body class="antialiased text-brown font-sans flex justify-center min-h-screen sm:p-8">

  <main class="w-full max-w-[400px] bg-white sm:rounded-[40px] sm:shadow-2xl overflow-hidden relative flex flex-col h-[100dvh] sm:h-[850px]">
    
    <!-- Top Area -->
    <div class="relative h-[28%] bg-brand flex flex-col items-center justify-center pt-6 z-0 overflow-hidden">
      <!-- Glows -->
      <div class="absolute -top-[50%] -right-[20%] w-[150%] h-[150%] bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.15)_0%,transparent_60%)] pointer-events-none"></div>
      <div class="absolute -bottom-[20%] -left-[20%] w-[120%] h-[120%] bg-[radial-gradient(circle_at_bottom_left,rgba(39,18,0,0.15)_0%,transparent_60%)] pointer-events-none"></div>
      
      <div class="relative z-10 flex flex-col items-center animate-fade-down">
        <!-- Floating Elements -->
        <div class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center mb-3 shadow-glow">
          <svg width="24" height="24" viewBox="0 0 48 48" fill="none">
            <rect x="12" y="26" width="24" height="8" rx="4" fill="#fff" opacity="0.95" />
            <rect x="10" y="22" width="28" height="5" rx="2.5" fill="#fff" opacity="0.6" />
            <rect x="13" y="19" width="22" height="4" rx="2" fill="#fff" opacity="0.85" />
            <rect x="11" y="16" width="26" height="4" rx="2" fill="#fff" opacity="0.45" />
          </svg>
        </div>
        <h1 class="font-display text-[22px] font-black text-white tracking-widest uppercase mb-0.5 drop-shadow-md">Burger Farm</h1>
        <p class="font-sans text-[13px] font-medium text-white/80 italic">Tell us how you like it</p>
      </div>
    </div>

    <!-- Sheet Content -->
    <div class="flex-1 bg-white shadow-float rounded-t-[40px] px-8 pt-8 pb-8 flex flex-col z-10 relative -mt-6">
      
      <!-- Progress Bar -->
      <div class="flex items-center gap-2.5 mb-6">
        <div class="h-2 flex-1 bg-brand/20 rounded-full overflow-hidden"><div class="h-full w-full bg-brand rounded-full"></div></div>
        <div class="h-2 flex-1 bg-brand/20 rounded-full overflow-hidden"><div class="h-full w-full bg-brand rounded-full"></div></div>
        <div class="h-2 flex-1 bg-brand rounded-full shadow-[0_0_8px_rgba(232,86,10,0.4)]"></div>
      </div>
      <p class="text-[10px] font-black text-brand uppercase tracking-[0.2em] mb-6">Step 3 of 3</p>

      <!-- Form Content -->
      <div class="flex-1 overflow-y-auto pb-10">
        
        <!-- Name Input -->
        <div class="mb-8">
          <label class="block font-sans text-[15px] font-semibold text-brown mb-3">What do we call you?</label>
          <div class="flex items-center gap-3 bg-[#FAFAFA] border-[1.5px] border-line rounded-2xl p-4 shadow-inset_soft focus-within:border-brand focus-within:bg-white focus-within:shadow-[0_8px_24px_rgba(232,86,10,0.15)] transition-all duration-300 ease-spring">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--tw-colors-brand-DEFAULT)">
              <path d="M12 2a5 5 0 1 0 0 10A5 5 0 0 0 12 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/>
            </svg>
            <input type="text" placeholder="Your first name" class="flex-1 bg-transparent border-none outline-none text-[16px] font-bold text-brown font-sans w-full placeholder:text-brown-muted/50" />
          </div>
        </div>

        <!-- Food Preference -->
        <div class="mb-8">
          <label class="block font-sans text-[15px] font-semibold text-brown mb-3">Food preference?</label>
          <div class="grid grid-cols-2 gap-3">
            <!-- Veg Toggle -->
            <label class="cursor-pointer group active:scale-[0.96] transition-transform duration-300 ease-spring">
              <input type="radio" name="diet" value="veg" checked class="peer hidden" />
              <div class="flex items-center justify-center gap-2 border-[1.5px] border-line rounded-2xl py-4 transition-all duration-300 ease-spring peer-checked:border-success peer-checked:bg-success/5 shadow-sm peer-checked:shadow-soft">
                <svg width="16" height="16" viewBox="0 0 16 16">
                  <rect width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" class="text-success" />
                  <circle cx="8" cy="8" r="3.5" fill="currentColor" class="text-success" />
                </svg>
                <span class="text-sm font-bold text-brown peer-checked:text-success">Pure Veg</span>
              </div>
            </label>
            <!-- Non-Veg Toggle -->
            <label class="cursor-pointer group active:scale-[0.96] transition-transform duration-300 ease-spring">
              <input type="radio" name="diet" value="non-veg" class="peer hidden" />
              <div class="flex items-center justify-center gap-2 border-[1.5px] border-line rounded-2xl py-4 transition-all duration-300 ease-spring peer-checked:border-danger peer-checked:bg-danger/5 shadow-sm peer-checked:shadow-soft">
                <svg width="16" height="16" viewBox="0 0 16 16">
                  <rect width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" class="text-danger" />
                  <polygon points="8,3 13,12 3,12" fill="currentColor" class="text-danger" />
                </svg>
                <span class="text-sm font-bold text-brown peer-checked:text-danger">Non-Veg</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Cravings -->
        <div class="mb-4">
          <label class="block font-sans text-[15px] font-semibold text-brown mb-3">Usually craving?</label>
          <div class="flex flex-wrap gap-3">
            <!-- Chips -->
            <label class="cursor-pointer active:scale-[0.96] transition-transform duration-300 ease-spring">
              <input type="checkbox" checked class="peer hidden" />
              <div class="flex items-center gap-2 px-5 py-3 border-[1.5px] border-line rounded-full transition-all duration-300 ease-spring peer-checked:border-brand peer-checked:bg-brand-light/80 shadow-sm peer-checked:shadow-soft">
                <span class="text-[14px]">🍔</span>
                <span class="text-[14px] font-bold text-brown peer-checked:text-brand">Burgers</span>
              </div>
            </label>
            <label class="cursor-pointer active:scale-[0.96] transition-transform duration-300 ease-spring">
              <input type="checkbox" class="peer hidden" />
              <div class="flex items-center gap-2 px-5 py-3 border-[1.5px] border-line rounded-full transition-all duration-300 ease-spring peer-checked:border-brand peer-checked:bg-brand-light/80 shadow-sm peer-checked:shadow-soft">
                <span class="text-[14px]">🍟</span>
                <span class="text-[14px] font-bold text-brown peer-checked:text-brand">Sides</span>
              </div>
            </label>
            <label class="cursor-pointer active:scale-[0.96] transition-transform duration-300 ease-spring">
              <input type="checkbox" class="peer hidden" />
              <div class="flex items-center gap-2 px-5 py-3 border-[1.5px] border-line rounded-full transition-all duration-300 ease-spring peer-checked:border-brand peer-checked:bg-brand-light/80 shadow-sm peer-checked:shadow-soft">
                <span class="text-[14px]">🥤</span>
                <span class="text-[14px] font-bold text-brown peer-checked:text-brand">Drinks</span>
              </div>
            </label>
            <label class="cursor-pointer active:scale-[0.96] transition-transform duration-300 ease-spring">
              <input type="checkbox" class="peer hidden" />
              <div class="flex items-center gap-2 px-5 py-3 border-[1.5px] border-line rounded-full transition-all duration-300 ease-spring peer-checked:border-brand peer-checked:bg-brand-light/80 shadow-sm peer-checked:shadow-soft">
                <span class="text-[14px]">🌶️</span>
                <span class="text-[14px] font-bold text-brown peer-checked:text-brand">Spicy</span>
              </div>
            </label>
            <label class="cursor-pointer active:scale-[0.96] transition-transform duration-300 ease-spring">
              <input type="checkbox" class="peer hidden" />
              <div class="flex items-center gap-2 px-5 py-3 border-[1.5px] border-line rounded-full transition-all duration-300 ease-spring peer-checked:border-brand peer-checked:bg-brand-light/80 shadow-sm peer-checked:shadow-soft">
                <span class="text-[14px]">🥗</span>
                <span class="text-[14px] font-bold text-brown peer-checked:text-brand">Light</span>
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- Footer CTA -->
      <div class="mt-auto pt-4 bg-white z-20">
        <button class="w-full relative overflow-hidden bg-brand text-white font-bold text-[17px] py-4.5 rounded-[20px] shadow-brand-glow active:scale-[0.97] transition-all duration-300 ease-spring flex items-center justify-center gap-2 group h-14" onclick="window.location.href='location.html'">
          <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-[150%] group-hover:translate-x-[150%] transition-transform duration-700"></div>
          <span class="relative z-10 flex items-center gap-2 text-[16px]">
            Let's Eat
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-1 transition-transform"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </span>
        </button>
      </div>
      
    </div>
    
  </main>

  <style>
    /* Premium Noise Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    @keyframes fade-down { 0% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 1; transform: translateY(0); } }
    .animate-fade-down { animation: fade-down 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
  </style>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof gsap !== 'undefined') {
        gsap.from(".rounded-t-\\[40px\\]", { y: 40, opacity: 0, duration: 0.8, ease: "expo.out" });
        gsap.from(".flex-1.overflow-y-auto > div", { y: 15, opacity: 0, duration: 0.6, stagger: 0.1, delay: 0.2, ease: "expo.out", clearProps: "all" });
        gsap.from(".mt-auto", { y: 20, opacity: 0, duration: 0.6, delay: 0.6, ease: "back.out(1.5)", clearProps: "all" });
      }
    });
  </script>
</body>
</html>
