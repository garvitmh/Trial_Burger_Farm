<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Burger Farm - Home</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#E8560A', hover: '#C94208', light: '#FFF0E5' },
            brown: { DEFAULT: '#271200', muted: 'rgba(39, 18, 0, 0.42)', light: 'rgba(39, 18, 0, 0.06)' },
            cream: '#FBF7F2',
            line: '#EBE1D6',
            success: '#1A7A38',
            danger: '#C0001A',
          },
          fontFamily: {
            display: ['"Montreux Classic"', 'sans-serif'],
            sans: ['"Recoleta"', 'serif'],
          },
          boxShadow: {
            soft: '0 4px 24px rgba(39, 18, 0, 0.04), 0 1px 2px rgba(39, 18, 0, 0.02)',
            premium: '0 20px 40px -10px rgba(39,18,0,0.08), 0 1px 3px rgba(39,18,0,0.05)',
            glow: '0 8px 24px rgba(232, 86, 10, 0.25)',
            'brand-glow': '0 10px 30px -10px rgba(232,86,10,0.4), 0 4px 10px rgba(232,86,10,0.2)',
            float: '0 -12px 32px rgba(39, 18, 0, 0.04)',
            inset_soft: 'inset 0 2px 8px rgba(39, 18, 0, 0.04)',
          },
          transitionTimingFunction: {
            'spring': 'cubic-bezier(0.16, 1, 0.3, 1)',
          }
        }
      }
    }
  </script>
  
  <style>
    /* Premium Noise Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-semibold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Montreux Classic'; src: url('fonts/montreux-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Montreux Classic'; src: url('fonts/montreux-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    
    body { background-color: #F5EFE6; }
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
    
    .scroll-snap-x { scroll-snap-type: x mandatory; }
    .snap-center { scroll-snap-align: center; }
  </style>
</head>

<body class="antialiased text-brown font-sans flex justify-center min-h-screen sm:p-8">

  <main class="w-full max-w-[400px] bg-[#FAFAFA] sm:rounded-[40px] sm:shadow-2xl overflow-hidden relative flex flex-col h-[100dvh] sm:h-[850px]">
    
    <!-- Header -->
    <header class="px-6 pt-12 pb-4 bg-white shadow-sm flex items-center justify-between z-20">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-brand flex items-center justify-center text-white font-bold font-display shadow-glow">
          V
        </div>
        <div>
          <p class="text-[11px] font-bold text-brown-muted uppercase tracking-widest mb-0.5">Deliver to</p>
          <div class="flex items-center gap-1 cursor-pointer" onclick="window.location.href='address.html'">
            <span class="text-[14px] font-bold text-brown truncate max-w-[140px]">Home, 4B Block</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" class="text-brand"><path d="M7 10l5 5 5-5z"/></svg>
          </div>
        </div>
      </div>
      <button class="relative w-10 h-10 rounded-full bg-cream border border-line flex items-center justify-center hover:bg-line transition-colors">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brown">
          <path d="M9 20a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/><path d="M20 20a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span class="absolute top-0 right-0 w-3 h-3 bg-brand rounded-full border-2 border-white"></span>
      </button>
    </header>

    <!-- Main Content (Scrollable) -->
    <div class="flex-1 overflow-y-auto pb-24">
      
      <!-- Search Bar -->
      <div class="px-6 py-4 animate-fade-in-up" style="animation-delay: 0.1s;">
        <div class="flex items-center gap-3 bg-white border-[1.5px] border-line rounded-full px-4 py-3 shadow-soft focus-within:border-brand focus-within:shadow-[0_0_0_4px_rgba(232,86,10,0.1)] transition-all">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-brown-muted">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" placeholder="Search burgers, sides..." class="flex-1 bg-transparent border-none outline-none text-[14px] font-bold text-brown placeholder:font-medium placeholder:text-brown-muted w-full" />
        </div>
      </div>

      <!-- Hero Banner -->
      <div class="px-6 mb-8 animate-fade-in-up" style="animation-delay: 0.2s;">
        <div class="relative w-full h-44 rounded-[28px] overflow-hidden shadow-brand-glow cursor-pointer group active:scale-[0.98] transition-all duration-300 ease-spring" onclick="window.location.href='detail.html'">
          <!-- Mesh Gradient Background -->
          <div class="absolute inset-0 bg-brand z-0"></div>
          <div class="absolute inset-0 bg-gradient-to-r from-brand via-brand to-transparent z-10"></div>
          
          <!-- Floating Particles / Mesh Orbs -->
          <div class="absolute -left-10 -bottom-10 w-48 h-48 bg-[#FF7A33]/80 rounded-full blur-[40px] z-0 animate-pulse"></div>
          <div class="absolute right-0 -top-20 w-56 h-56 bg-[#C94208]/60 rounded-full blur-[50px] z-0"></div>
          <div class="absolute right-20 top-20 w-32 h-32 bg-[#FFB085]/40 rounded-full blur-[30px] z-0"></div>
          
          <div class="relative z-20 h-full flex flex-col justify-center p-6">
            <span class="inline-block bg-white/20 text-white text-[10px] font-black uppercase tracking-[0.2em] px-2.5 py-1.5 rounded-lg w-fit mb-2 backdrop-blur-md border border-white/30 shadow-sm">New Release</span>
            <h3 class="font-display text-[26px] font-black text-white leading-[1.1] mb-1 drop-shadow-md">Truffle<br>Mushroom</h3>
            <div class="flex items-center gap-1.5 text-white font-bold text-[15px]">
              ₹249 <span class="text-white/60 line-through text-[12px] font-medium ml-1">₹299</span>
            </div>
          </div>
          
          <!-- High-Fidelity Burger Image -->
          <div class="absolute -right-10 top-1/2 -translate-y-1/2 w-48 h-48 bg-[url('veg_burger.png')] bg-cover bg-no-repeat bg-center z-10" style="filter: drop-shadow(-10px 10px 20px rgba(0,0,0,0.3));"></div>
        </div>
      </div>

      <!-- Categories -->
      <div class="mb-6 animate-fade-in-up" style="animation-delay: 0.3s;">
        <div class="px-6 flex items-center justify-between mb-4">
          <h4 class="font-display text-[18px] font-black text-brown">Categories</h4>
        </div>
        <div class="flex gap-4 px-6 overflow-x-auto scroll-snap-x pb-4 pt-1 -mt-1 hide-scrollbar">
          
          <!-- Category 1 -->
          <div class="flex flex-col items-center gap-2 shrink-0 snap-center cursor-pointer group">
            <div class="w-16 h-16 rounded-2xl bg-brand flex items-center justify-center shadow-brand-glow group-hover:-translate-y-1 group-active:scale-95 transition-all duration-300 ease-spring border border-white/20">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M2 17h20v2H2v-2zm1.15-4.05C3.05 12.62 3 12.31 3 12c0-3.87 3.13-7 7-7s7 3.13 7 7c0 .31-.05.62-.15.95A5.99 5.99 0 0 1 21 13h1v2H2v-2h1c1.52 0 2.88-.6 3.89-1.56.67.35 1.41.56 2.11.56.7 0 1.44-.21 2.11-.56C12.12 12.4 13.48 13 15 13h1.15zM2 19h20v2H2v-2z"/></svg>
            </div>
            <span class="text-[12px] font-bold text-brown">Burgers</span>
          </div>
          
          <!-- Category 2 (Fixed SVG) -->
          <div class="flex flex-col items-center gap-2 shrink-0 snap-center cursor-pointer group">
            <div class="w-16 h-16 rounded-[20px] bg-white border border-line/60 flex items-center justify-center shadow-premium group-hover:-translate-y-1 group-hover:border-brand/40 group-active:scale-95 transition-all duration-300 ease-spring relative overflow-hidden">
              <div class="absolute inset-0 bg-brand/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" class="text-brand">
                <path d="M14 2H10l-1 4h6l-1-4zM5 8v2c0 .55.45 1 1 1h1v9c0 .55.45 1 1 1h8c.55 0 1-.45 1-1v-9h1c.55 0 1-.45 1-1V8H5zm3 3h2v7H8v-7zm4 0h2v7h-2v-7z"/>
              </svg>
            </div>
            <span class="text-[12px] font-bold text-brown-muted">Sides</span>
          </div>
          
          <!-- Category 3 -->
          <div class="flex flex-col items-center gap-2 shrink-0 snap-center cursor-pointer group">
            <div class="w-16 h-16 rounded-[20px] bg-white border border-line/60 flex items-center justify-center shadow-premium group-hover:-translate-y-1 group-hover:border-brand/40 group-active:scale-95 transition-all duration-300 ease-spring relative overflow-hidden">
              <div class="absolute inset-0 bg-brand/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="text-brand relative z-10"><path d="M6 2v6c0 2.76 2.24 5 5 5s5-2.24 5-5V2h2v6c0 3.53-2.61 6.43-6 6.92V18h3v2H9v-2h3v-3.08C8.61 14.43 6 11.53 6 8V2h2z"/><path d="M18 2v3c0 1.1-.9 2-2 2h-1V2h3z" opacity=".5"/></svg>
            </div>
            <span class="text-[12px] font-bold text-brown-muted">Drinks</span>
          </div>
          
          <!-- Category 4 -->
          <div class="flex flex-col items-center gap-2 shrink-0 snap-center cursor-pointer group">
            <div class="w-16 h-16 rounded-2xl bg-white border border-line flex items-center justify-center shadow-soft group-hover:scale-105 group-hover:border-brand transition-all">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="text-brand"><path d="M12 6c-1.1 0-2 .9-2 2 0 .74.4 1.38 1 1.72V11h2V9.72c.6-.34 1-.98 1-1.72 0-1.1-.9-2-2-2z"/><path d="M18 17H6c-1.1 0-2-.9-2-2V7c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2zM6 19h12v2H6v-2z" opacity=".7"/><path d="M9 22h6l-1-3H10l-1 3z"/></svg>
            </div>
            <span class="text-[12px] font-bold text-brown-muted">Desserts</span>
          </div>

        </div>
      </div>

      <!-- Popular Items -->
      <div class="px-6 animate-fade-in-up" style="animation-delay: 0.4s;">
        <h4 class="font-display text-[18px] font-black text-brown mb-4">Popular Now</h4>
        
        <div class="flex flex-col gap-5">
          <!-- Item Card 1 -->
          <div class="bg-white/80 backdrop-blur-sm border-[1.5px] border-line rounded-[24px] p-3 flex gap-4 shadow-premium cursor-pointer hover:border-brand/40 active:scale-[0.97] transition-all duration-300 ease-spring group" onclick="window.location.href='detail.html'">
            <div class="w-28 h-28 rounded-2xl bg-cream flex items-center justify-center overflow-hidden shrink-0 relative">
              <div class="absolute inset-0 bg-[url('veg_burger.png')] bg-cover bg-center group-hover:scale-110 transition-transform duration-500"></div>
            </div>
            <div class="flex flex-col justify-center flex-1 py-1 pr-2">
              <div class="flex items-center gap-1.5 mb-1.5">
                <div class="w-3.5 h-3.5 border-[1.5px] border-green-600 rounded-[3px] flex items-center justify-center"><div class="w-1.5 h-1.5 rounded-full bg-green-600"></div></div>
                <span class="text-[10px] font-bold text-green-600 uppercase tracking-wider">Veg</span>
              </div>
              <h5 class="font-bold text-[16px] text-brown leading-tight mb-1.5 group-hover:text-brand transition-colors">Farmhouse Special</h5>
              <p class="text-[12px] text-brown-muted font-medium mb-3 line-clamp-1">Crispy patty, fresh veggies, secret sauce.</p>
              <div class="flex items-center justify-between mt-auto">
                <span class="font-display font-black text-[18px] text-brown">₹149</span>
                <button class="w-8 h-8 rounded-full bg-brand text-white flex items-center justify-center shadow-[0_4px_12px_rgba(232,86,10,0.3)] active:scale-95 transition-transform">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                </button>
              </div>
            </div>
          </div>
          
          <!-- Item Card 2 -->
          <div class="bg-white/80 backdrop-blur-sm border-[1.5px] border-line rounded-[24px] p-3 flex gap-4 shadow-premium cursor-pointer hover:border-brand/40 active:scale-[0.97] transition-all duration-300 ease-spring group" onclick="window.location.href='detail.html'">
            <div class="w-28 h-28 rounded-2xl bg-cream flex items-center justify-center overflow-hidden shrink-0 relative">
              <div class="absolute inset-0 bg-[url('nonveg_burger.png')] bg-cover bg-center group-hover:scale-110 transition-transform duration-500"></div>
            </div>
            <div class="flex flex-col justify-center flex-1 py-1 pr-2">
              <div class="flex items-center gap-1.5 mb-1.5">
                <div class="w-3.5 h-3.5 border-[1.5px] border-red-600 rounded-[3px] flex items-center justify-center"><div class="w-1.5 h-1.5 rounded-full bg-red-600"></div></div>
                <span class="text-[10px] font-bold text-red-600 uppercase tracking-wider">Non-Veg</span>
              </div>
              <h5 class="font-bold text-[16px] text-brown leading-tight mb-1.5 group-hover:text-brand transition-colors">Double Chicken XL</h5>
              <p class="text-[12px] text-brown-muted font-medium mb-3 line-clamp-1">Two grilled patties, extra cheese.</p>
              <div class="flex items-center justify-between mt-auto">
                <span class="font-display font-black text-[18px] text-brown">₹229</span>
                <button class="w-8 h-8 rounded-full bg-white text-brand border-[1.5px] border-brand flex items-center justify-center shadow-sm active:scale-95 transition-transform">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="absolute bottom-0 inset-x-0 h-[84px] bg-white/90 backdrop-blur-xl shadow-float border-t border-white/60 rounded-t-[32px] flex justify-around items-center px-6 z-30 pb-2">
      <!-- Active Item -->
      <div class="flex flex-col items-center gap-1.5 cursor-pointer text-brand relative group">
        <div class="absolute -inset-2 bg-brand/10 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="relative z-10 drop-shadow-sm"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-[11px] font-black tracking-wide relative z-10">Home</span>
        <div class="absolute -bottom-2 w-1.5 h-1.5 bg-brand rounded-full shadow-glow"></div>
      </div>
      <div class="flex flex-col items-center gap-1 cursor-pointer text-brown-muted hover:text-brown transition-colors">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        <span class="text-[10px] font-bold">Offers</span>
      </div>
      <div class="flex flex-col items-center gap-1 cursor-pointer text-brown-muted hover:text-brown transition-colors">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span class="text-[10px] font-bold">Orders</span>
      </div>
      <div class="flex flex-col items-center gap-1 cursor-pointer text-brown-muted hover:text-brown transition-colors" onclick="window.location.href='splash.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="text-[10px] font-bold">Profile</span>
      </div>
    </nav>
    
  </main>

  <style>
    /* Premium Noise Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    @keyframes fade-in-up { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  
</body>
</html>
