<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Burger Farm - Splash</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#E8560A', hover: '#C94208', light: '#FFF0E5' },
            brown: { DEFAULT: '#271200', muted: 'rgba(39, 18, 0, 0.42)', light: 'rgba(39, 18, 0, 0.06)' },
            cream: '#FBF7F2',
            line: '#EBE1D6',
            success: '#1A7A38',
            danger: '#C0001A',
          },
          fontFamily: {
            display: ['"Montreux Classic"', 'sans-serif'],
            sans: ['"Recoleta"', 'serif'],
          },
          boxShadow: {
            soft: '0 4px 24px rgba(39, 18, 0, 0.04), 0 1px 2px rgba(39, 18, 0, 0.02)',
            premium: '0 20px 40px -10px rgba(39,18,0,0.08), 0 1px 3px rgba(39,18,0,0.05)',
            glow: '0 8px 24px rgba(232, 86, 10, 0.25)',
            'brand-glow': '0 10px 30px -10px rgba(232,86,10,0.4), 0 4px 10px rgba(232,86,10,0.2)',
            float: '0 -12px 32px rgba(39, 18, 0, 0.04)',
            inset_soft: 'inset 0 2px 8px rgba(39, 18, 0, 0.04)',
          },
          transitionTimingFunction: {
            'spring': 'cubic-bezier(0.16, 1, 0.3, 1)',
          }
        }
      }
    }
  </script>
  
  <style>
    /* Premium Noise Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-semibold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
    @font-face { font-family: 'Recoleta'; src: url('fonts/recoleta-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Montreux Classic'; src: url('fonts/montreux-regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Montreux Classic'; src: url('fonts/montreux-bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    
    body { background-color: #F5EFE6; }
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    /* Orbit Animation */
    .orbit-path { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 2s ease-in-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
    .ring-anim { animation: pulse-ring 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1); }
  </style>
</head>

<body class="antialiased font-sans flex justify-center min-h-screen sm:p-8 cursor-pointer" onclick="window.location.href='onboarding.html'">

  <!-- Main App Container -->
  <main class="w-full max-w-[400px] bg-brand sm:rounded-[40px] sm:shadow-2xl overflow-hidden relative flex flex-col h-[100dvh] sm:h-[850px] items-center justify-center">
    
    <!-- Premium Background Glow & Mesh -->
    <div class="absolute inset-0 bg-brand z-0"></div>
    <div class="absolute -top-[20%] -left-[10%] w-[120%] h-[120%] bg-[radial-gradient(ellipse_at_top_right,rgba(255,255,255,0.15)_0%,transparent_60%)] z-0 pointer-events-none"></div>
    <div class="absolute -bottom-[20%] -right-[10%] w-[120%] h-[120%] bg-[radial-gradient(ellipse_at_bottom_left,rgba(39,18,0,0.15)_0%,transparent_60%)] z-0 pointer-events-none"></div>
    <!-- Floating Ambient Orbs -->
    <div class="absolute top-[20%] left-[10%] w-64 h-64 bg-[#FFB085] rounded-full mix-blend-overlay filter blur-[60px] opacity-20 animate-pulse" style="animation-duration: 4s;"></div>
    <div class="absolute bottom-[20%] right-[10%] w-72 h-72 bg-[#C94208] rounded-full mix-blend-overlay filter blur-[80px] opacity-30 animate-pulse" style="animation-duration: 6s;"></div>

    <!-- Center Content -->
    <div class="relative z-10 flex flex-col items-center">
      <!-- Premium Glassmorphism Logo Mark -->
      <div class="mb-8 relative group cursor-pointer">
        <div class="absolute inset-0 rounded-full border border-white/30 ring-anim"></div>
        <div class="absolute inset-0 rounded-full border border-white/10 ring-anim" style="animation-delay: 1s;"></div>
        <div class="w-24 h-24 rounded-full bg-white/10 backdrop-blur-xl border-t border-white/40 border-b border-white/10 flex items-center justify-center shadow-[0_12px_40px_rgba(39,18,0,0.25),inset_0_2px_4px_rgba(255,255,255,0.2)] overflow-hidden group-active:scale-95 transition-transform duration-500">
          <svg width="56" height="56" viewBox="0 0 48 48" fill="none">
            <rect x="10" y="27" width="28" height="9" rx="4.5" fill="#fff" opacity=".95" />
            <rect x="8" y="22" width="32" height="6" rx="3" fill="rgba(255,255,255,0.7)" />
            <rect x="11" y="18" width="26" height="5" rx="2.5" fill="#fff" opacity=".9" />
            <rect x="9" y="14" width="30" height="5" rx="2.5" fill="rgba(255,255,255,0.5)" />
          </svg>
        </div>
      </div>

      <!-- Typography with Premium Shadow -->
      <h1 class="font-display text-[64px] font-black text-white leading-[0.85] tracking-tighter text-center drop-shadow-[0_4px_16px_rgba(39,18,0,0.2)] relative">
        BURGER<br>FARM
        <div class="absolute -inset-4 bg-white/5 blur-2xl rounded-full -z-10"></div>
      </h1>
      
      <!-- Decorative Wave -->
      <svg class="mt-6 mb-4 opacity-80 w-24 h-3 drop-shadow-sm" viewBox="0 0 100 10">
        <path d="M0 5 Q12 0 25 5 T50 5 T75 5 T100 5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" />
      </svg>
      
      <p class="font-display italic text-white/95 text-xl tracking-wide drop-shadow-[0_2px_4px_rgba(39,18,0,0.15)]">Farm-Fresh. Always.</p>
    </div>

    <!-- Premium Loader at Bottom -->
    <div class="absolute bottom-24 w-full flex flex-col items-center">
      <div class="relative w-48 h-20">
        <svg class="absolute bottom-0 left-1/2 -translate-x-1/2 w-48 h-20 overflow-visible opacity-60">
          <path class="orbit-path" d="M10,70 A80,80 0 0,1 180,70" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round" />
        </svg>
        
        <!-- Loading Bar -->
        <div class="absolute top-full mt-4 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-white/10 backdrop-blur-sm rounded-full overflow-hidden shadow-inner">
          <div class="h-full bg-white/90 rounded-full w-1/3" style="animation: slide 2s infinite cubic-bezier(0.4, 0, 0.2, 1);"></div>
        </div>
      </div>
      
      <p class="mt-8 text-[10px] font-bold text-white/50 uppercase tracking-[0.25em] drop-shadow-sm">Tap to continue</p>
    </div>

    <!-- Bottom Home Indicator Line -->
    <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-36 h-1.5 bg-white/30 rounded-full pointer-events-none backdrop-blur-sm"></div>
    
  </main>

  <style>
    /* Premium Noise Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof gsap !== 'undefined') {
        gsap.from(".font-display", { y: 30, opacity: 0, duration: 1.2, stagger: 0.15, ease: "expo.out", delay: 0.2 });
        gsap.from(".italic", { y: 20, opacity: 0, duration: 1.2, ease: "expo.out", delay: 0.5 });
      }
    });
  </script>
</body>
</html>
